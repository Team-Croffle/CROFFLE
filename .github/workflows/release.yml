name: Croffle Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # GITHUB_TOKEN이 Release 노트를 생성하고 파일을 업로드할 수 있도록 쓰기 권한 부여
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Vite App
        run: yarn build

      - name: Package and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: yarn electron-builder --mac -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: yarn electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: yarn electron-builder --linux -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

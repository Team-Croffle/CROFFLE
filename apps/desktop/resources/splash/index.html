<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: oklch(0.785 0.104 69.8);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }

      .loading-text {
        margin: 0;
        font-size: 2rem;
        font-family: 'Fredoka', sans-serif;
        color: #fff;
      }

      @font-face {
        font-family: 'Fredoka';
        src: url('./fonts/Fredoka-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="../logo-only-white-tp.svg" alt="Croffle" width="192" height="192" />
      <p class="loading-text">Loading...</p>
    </div>
  </body>
</html>
